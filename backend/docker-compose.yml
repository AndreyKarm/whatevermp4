version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["8080:8080"]
    env_file: .env
    depends_on: [auth, catalog, rooms, social, processing]

  auth:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    ports: ["8081:8081"]
    env_file: .env
    depends_on: [postgres]

  catalog:
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    ports: ["8082:8082"]
    env_file: .env
    depends_on: [postgres]

  processing:
    build: { context: ., dockerfile: services/processing/Dockerfile }
    ports: ["8083:8083"]
    env_file: .env
    depends_on: [postgres]

  rooms:
    build: { context: ., dockerfile: services/rooms/Dockerfile }
    ports: ["8084:8084"]
    env_file: .env
    depends_on: [postgres]

  social:
    build: { context: ., dockerfile: services/social/Dockerfile }
    ports: ["8085:8085"]
    env_file: .env
    depends_on: [postgres]

volumes:
  pgdata: