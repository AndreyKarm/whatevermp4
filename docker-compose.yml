services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9044:9000"
      - "9045:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: movies
      RUSTFS_SECRET_KEY: ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
    volumes:
      - movies_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: movie-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U movieuser -d local"]
      interval: 5s
      timeout: 5s
      retries: 5

  movie:
    build:
      context: ./backend
    container_name: movie-server
    depends_on:
      rustfs:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - ADDR=:8088
      - S3_ENDPOINT=http://rustfs:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9044
      - S3_REGION=us-east-1
      - S3_BUCKET=movies
      - S3_ACCESS_KEY=movies
      - S3_SECRET_KEY=ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
      - DATABASE_URL=postgres://movieuser:ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a@db:5432/local?sslmode=disable
      - PLAYBACK_SECRET=${PLAYBACK_SECRET}
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8088:8088"

  web:
    build:
      context: ./frontend
    container_name: movie-web
    depends_on:
      - movie
    environment:
      - DATABASE_URL="postgres://movieuser:ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a@127.0.0.1:5432/local"
      - ORIGIN="http://localhost:5173"
      - BACKEND_URL="http://localhost:8088"
      - BETTER_AUTH_SECRET="be1180b5983c2793f5daa367050be5ee5963183a9fff5297df98ba1b21dfed65"
      - DISCORD_CLIENT_ID = "1560785803993678015"
      - DISCORD_CLIENT_SECRET = "lFi8b8_MG7SDXVH5h4KVoANouwhG_EON" 
      - BODY_SIZE_LIMIT=10G
    ports:
      - "3000:3000"

volumes:
  pgdata:
  movies_data: