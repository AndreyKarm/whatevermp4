services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9044:9000"
      - "9045:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: movies
      RUSTFS_SECRET_KEY: ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
    volumes:
      - movies_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: movie-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U movieuser -d local"]
      interval: 5s
      timeout: 5s
      retries: 5

  movie:
    build:
      context: ./backend
    container_name: movie-server
    depends_on:
      rustfs:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - PORT=8088
      - S3_ENDPOINT_URL=rustfs:9000
      - S3_BUCKET_NAME=movies
      - S3_ACCESS_KEY_ID=movies
      - S3_SECRET_ACCESS_KEY=ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
      - S3_USE_SSL=false
      - DATABASE_URL=postgres://movieuser:ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a@db:5432/local
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
    ports:
      - "8088:8088"

  web:
    build:
      context: ./frontend
      args:
        VITE_RADIO_URL: "http://localhost:8088"
    container_name: movie-web
    depends_on:
      - movie
    environment:
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - ORIGIN=http://localhost:3000
      - VITE_RADIO_URL=http://movie:8088
      - BODY_SIZE_LIMIT=5G
    ports:
      - "3000:3000"

volumes:
  pgdata:
  movies_data: