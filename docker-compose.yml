services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: movie-rustfs
    restart: unless-stopped
    ports:
      - "9044:9000"
      - "9045:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "movies"
      RUSTFS_SECRET_KEY: "ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a"
    volumes:
      - movies_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: movie-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "movieuser"
      POSTGRES_PASSWORD: "ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a"
      POSTGRES_DB: "local"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d local"]
      interval: 5s
      timeout: 5s
      retries: 5

  movie:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: movie-server
    restart: unless-stopped
    command: ["./movie-server"]
    depends_on:
      rustfs:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      ADDR: :8088
      DATABASE_URL: postgres://movieuser:ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a@db:5432/local?sslmode=disable
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9044
      S3_REGION: us-east-1
      S3_BUCKET: movies
      S3_ACCESS_KEY: movies
      S3_SECRET_KEY: ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
      WORK_DIR: /tmp/work
      PLAYBACK_SECRET: 5a1f7593442279cd773638b37957b2bdf6b7cde811ef3302890de13ff6813f0c
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: movie-worker
    restart: unless-stopped
    command: ["./movie-worker"]
    depends_on:
      rustfs:
        condition: service_healthy
      db:
        condition: service_healthy
      movie:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://movieuser:ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a@db:5432/local?sslmode=disable
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9044
      S3_REGION: us-east-1
      S3_BUCKET: movies
      S3_ACCESS_KEY: movies
      S3_SECRET_KEY: ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a
      WORK_DIR: /tmp/work
      HW_ENCODER: ${HW_ENCODER:-none}
      WORKER_ADDR: :8089
    volumes:
      - worker_work:/tmp/work
    # /metrics (Prometheus) and /healthz; not published by default
    expose:
      - "8089"
    healthcheck:
      test: ["CMD", "./movie-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movie-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      movie:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://movieuser:ea0645717277d39c703a7086efef9271e253860d585c95e8f5d79d265f2bd88a@db:5432/local
      ORIGIN: http://localhost:3000
      BACKEND_URL: http://movie:8088
      PUBLIC_API_URL: http://localhost:8088
      BODY_SIZE_LIMIT: 10G
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  movies_data:
  worker_work: