# HTTPS front for the stack. Certificates come from CERTS_URL (see entrypoint.sh).

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

# Docker's DNS: upstreams are named through variables below, so they're re-resolved when a container
# is recreated with a new IP (and nginx starts even if one isn't up yet).
resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate /certs/fullchain.pem;
ssl_certificate_key /certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;

# Stream request bodies (upload parts are 64 MB) instead of spooling them to disk first.
client_max_body_size 0;
proxy_request_buffering off;
proxy_http_version 1.1;
# $http_host keeps the port: presigned S3 URLs sign the Host header as the browser sent it.
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# App: the web UI, plus the API on the same origin (/api, /play), so pages make no mixed-content calls.
server {
	listen 443 ssl;
	http2 on;
	server_name _;

	set $api http://movie:8088;
	set $web http://web:3000;

	location /api/ {
		proxy_pass $api;
		# WebSockets (/api/events, rooms) can stay quiet for a while
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
	location /play/ {
		proxy_pass $api;
	}
	location = /healthz {
		proxy_pass $api;
	}
	location / {
		proxy_pass $web;
	}
}

# S3 (RustFS) for presigned upload/download URLs. It needs a root path of its own because presigned
# URLs sign the path.
server {
	listen 9443 ssl;
	http2 on;
	server_name _;

	set $s3 http://rustfs:9000;

	location / {
		proxy_pass $s3;
		proxy_buffering off;
	}
}
